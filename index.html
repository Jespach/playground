<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historic Rainfall Explorer</title>
    <meta
      name="description"
      content="Browse a map, select a location, and pull historic rainfall data from Open-Meteo."
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="controls-panel">
        <div class="panel-header">
          <p class="eyebrow">Open-Meteo</p>
          <h1>Historic Rainfall Explorer</h1>
        </div>

        <div class="control-group">
          <label for="locationSearch">Search for a place</label>
          <div class="search-row">
            <input
              id="locationSearch"
              type="text"
              placeholder="Try London, Tokyo, Cape Town..."
            />
            <button id="searchBtn" type="button">Search</button>
          </div>
        </div>

        <div class="control-group">
          <label>Selected location</label>
          <div id="selectionInfo" class="selection-info">
            Click on the map or search for a place.
          </div>
        </div>

        <div class="date-grid">
          <div class="control-group">
            <label for="startDate">Start date</label>
            <input id="startDate" type="date" />
          </div>
          <div class="control-group">
            <label for="endDate">End date</label>
            <input id="endDate" type="date" />
          </div>
        </div>

        <div class="button-row">
          <button id="loadBtn" class="primary" type="button">Load rainfall</button>
          <button id="mapCenterBtn" type="button" class="secondary">
            Use map center
          </button>
        </div>

        <div class="summary-grid">
          <div class="summary-card">
            <span class="label">Total rainfall</span>
            <strong id="totalRainfall">--</strong>
          </div>
          <div class="summary-card">
            <span class="label">Average / day</span>
            <strong id="avgRainfall">--</strong>
          </div>
          <div class="summary-card wide">
            <span class="label">Wettest day</span>
            <strong id="wettestDay">--</strong>
          </div>
        </div>
      </aside>

      <main class="content-panel">
        <div id="map" aria-label="Rainfall map" role="application"></div>

        <section class="chart-panel">
          <div class="section-header">
            <h2>Rainfall trend</h2>
          </div>
          <canvas id="rainChart"></canvas>
        </section>

        <section class="table-panel">
          <div class="section-header">
            <h2>Daily rainfall</h2>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Rainfall</th>
                </tr>
              </thead>
              <tbody id="rainTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
